<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Error</title>
    <style>
        body {
            font-family: 'Courier New', monospace; /* Tech/robotic font */
            background: linear-gradient(135deg, #2c2c2c 0%, #1a1a1a 25%, #0f0f0f 50%, #000000 75%, #1a1a1a 100%);
            color: #00ff00; /* Green robotic color */
            text-align: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Robotic background with circuit-like grid and glow */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(0deg, rgba(0, 255, 0, 0.1) 0px, rgba(0, 255, 0, 0.1) 1px, transparent 1px, transparent 20px),
                repeating-linear-gradient(90deg, rgba(0, 255, 0, 0.1) 0px, rgba(0, 255, 0, 0.1) 1px, transparent 1px, transparent 20px),
                radial-gradient(circle at 50% 50%, rgba(0, 255, 0, 0.2) 0%, transparent 70%);
            animation: circuitGlow 5s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes circuitGlow {
            0% { opacity: 0.3; }
            100% { opacity: 0.7; }
        }

        h1 {
            font-size: 4em;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.8), 0 0 40px rgba(0, 255, 0, 0.6), 0 0 60px rgba(0, 255, 0, 0.4);
        }

        .floating {
            animation: float 3s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        p {
            font-size: 1.2em;
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 40px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5), 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .buttons {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: linear-gradient(45deg, #333333, #666666);
            border: 2px solid #00ff00;
            color: #00ff00;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            font-family: inherit;
            border-radius: 10px; /* More angular for robotic feel */
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.8), 0 0 40px rgba(0, 255, 0, 0.6), 0 4px 15px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 0, 0.4), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 0, 1), 0 0 60px rgba(0, 255, 0, 0.8), 0 8px 25px rgba(0, 0, 0, 0.6);
            background: linear-gradient(45deg, #666666, #333333);
            border-color: #00ff00;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
        }

        button:active {
            transform: translateY(0) scale(1);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            h1 {
                font-size: 3em;
            }
            .buttons {
                gap: 20px;
            }
            button {
                padding: 12px 25px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <h1><span class="floating">404</span> Page Not Found</h1>
    <p>Oops! The page you're looking for seems to have flown away. It might have been moved, deleted, or never existed.<br><br>Don't worry though - we have plenty of other opportunities waiting for you. Let's get you back on track.</p>
    <div class="buttons">
        <button id="goHome"><span>🏠</span> Back To Home</button>
        <button id="goBack"><span>⬅️</span> Go Back</button>
    </div>

    <script>
        document.getElementById('goHome').addEventListener('click', function() {
            window.location.href = '/'; // Adjust to your home page URL
        });

        document.getElementById('goBack').addEventListener('click', function() {
            window.history.back();
        });
    </script>
</body>
</html>
